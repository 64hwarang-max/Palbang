name: Build Palbang APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip v0.5 source
        run: |
          rm -rf palbang-src
          mkdir palbang-src
          unzip -o palbang-source-v0.5.zip -d palbang-src

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Palbang v0.5 APK
        working-directory: palbang-src
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Palbang-v0.5-APK
          path: palbang-src/app/build/outputs/apk/debug/app-debug.apk
